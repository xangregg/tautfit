<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- tautfit: the taut string (blue), a step fit with three plateaus like the Blocks signal, inside its gray tube.
         The tube widens across each jump so the step stays inside it. Drawn to read at 16 px: no points, the tube
         filling most of the tile. Colors are the app's light and dark theme tokens (styles.css), as in lafspline's
         icon. -->
    <style>
        .bg { fill: #fcfcfb; stroke: #d9d8d3; }
        .band { fill: #52514e; fill-opacity: 0.3; }
        .fit { fill: none; stroke: #2a78d6; }
        @media (prefers-color-scheme: dark) {
            .bg { fill: #1a1a19; stroke: #3a3a37; }
            .band { fill: #c3c2b7; fill-opacity: 0.34; }
            .fit { stroke: #5b9cf0; }
        }
    </style>
    <rect class="bg" x="0.5" y="0.5" width="31" height="31" rx="7" stroke-width="1"/>
    <path class="band" d="M3 16 L9 16 L11 3 L21 3 L23 10 L29 10
        L29 22 L21 22 L19 15 L13 15 L11 29 L3 29 Z"/>
    <path class="fit" d="M3.5 22 H11 V9 H21 V16 H28.5" stroke-width="2.6" stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
